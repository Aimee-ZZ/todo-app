{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">
  <div class="card-body p-4 p-md-5">
    <h1 class="display-5 fw-bold text-dark mb-4">To-Do App</h1>

    <form method="POST" class="row g-2 mb-4">
      <div class="col">
        <input
          type="text"
          name="content"
          class="form-control form-control-lg"
          placeholder="Add a new task..."
          aria-label="Add a task"
          required
        >
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary btn-lg">Add</button>
      </div>
    </form>

    <ul class="list-group">
      {% for task in tasks %}
        <li class="list-group-item d-flex align-items-center justify-content-between {% if task.completed %}list-group-item-success{% endif %}">
          <div class="d-flex align-items-center gap-3">
            <form method="POST" action="{{ url_for('complete', task_id=task.id) }}">
              <button
                type="submit"
                class="btn btn-sm {% if task.completed %}btn-success{% else %}btn-outline-secondary{% endif %}"
                aria-label="Toggle task complete"
              >
                {% if task.completed %}✓{% else %}○{% endif %}
              </button>
            </form>

            <span class="fw-medium {% if task.completed %}text-decoration-line-through text-muted{% endif %}">
              {{ task.content }}
            </span>
          </div>

          <form method="POST" action="{{ url_for('delete', task_id=task.id) }}">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              Delete
            </button>
          </form>
        </li>
      {% else %}
        <li class="list-group-item text-muted text-center py-4">
          No tasks yet — add your first one!
        </li>
      {% endfor %}
    </ul>
  </div>
</div>

{% endblock %}
